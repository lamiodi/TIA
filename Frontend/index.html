<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/x-icon" href="/public/favicon.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E1E1E" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- DNS Prefetch & Preconnect for backend & Cloudinary Media CDN -->
    <link rel="dns-prefetch" href="https://tia-backend-r331.onrender.com" />
    <link rel="preconnect" href="https://tia-backend-r331.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Toast styles -->
    <link rel="stylesheet" href="/styles/toast.css" />

    <!-- Organization Schema for Google Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The TiaBrand",
      "url": "https://www.thetiabrand.org/",
      "logo": "https://www.thetiabrand.org/favicon.png",
      "sameAs": [
        "https://www.instagram.com/tiastores.ng",
        "https://www.threads.com/@tiastores.ng"
      ]
    }
    </script>
  </head>
